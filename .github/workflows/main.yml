name: Build SADEE-DIMA APKs

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build User & Admin APKs
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'
          channel: stable
          cache: true

      # 3. Get dependencies
      - name: Flutter Pub Get
        run: flutter pub get

      # 4. Analyze project
      - name: Flutter Analyze
        run: flutter analyze --no-fatal-infos

      # 5. Build USER APK
      - name: Build User APK
        run: |
          flutter build apk \
            --release \
            -t lib/main_user.dart

      # 6. Rename USER APK
      - name: Prepare User APK
        run: |
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-release.apk \
             release/SADEE-DIMA-USER.apk

      # 7. Build ADMIN APK
      - name: Build Admin APK
        run: |
          flutter build apk \
            --release \
            -t lib/main_admin.dart

      # 8. Rename ADMIN APK
      - name: Prepare Admin APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk \
             release/SADEE-DIMA-ADMIN.apk

      # 9. Upload both APKs
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: SADEE-DIMA-APKs
          path: release/*.apk
          if-no-files-found: error
