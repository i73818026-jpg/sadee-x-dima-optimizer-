      - name: Fix Android build versions
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Fixing Android Gradle / AGP / Kotlin versions..."

          # Gradle
          sed -i \
            's#distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-8.14.5-bin.zip#' \
            android/gradle/wrapper/gradle-wrapper.properties

          # AGP
          if [ -f android/settings.gradle ]; then
            sed -i \
              's/id "com.android.application" version "[^"]*"/id "com.android.application" version "8.11.1"/' \
              android/settings.gradle

            # Kotlin
            sed -i \
              's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "2.2.20"/' \
              android/settings.gradle
          fi

          # Kotlin DSL support
          if [ -f android/settings.gradle.kts ]; then
            sed -i \
              's/id("com.android.application") version "[^"]*"/id("com.android.application") version "8.11.1"/' \
              android/settings.gradle.kts

            sed -i \
              's/id("org.jetbrains.kotlin.android") version "[^"]*"/id("org.jetbrains.kotlin.android") version "2.2.20"/' \
              android/settings.gradle.kts
          fi

          echo ""
          echo "===== Gradle ====="
          grep "distributionUrl" \
            android/gradle/wrapper/gradle-wrapper.properties || true

          echo ""
          echo "===== Android Gradle Plugin ====="
          grep "com.android.application" \
            android/settings.gradle 2>/dev/null || true

          echo ""
          echo "===== Kotlin ====="
          grep "kotlin.android" \
            android/settings.gradle 2>/dev/null || true

          echo ""
          echo "Android versions fixed."
